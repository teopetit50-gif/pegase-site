# ══════════════════════════════════════════════════════════════════════
# Les six sites dédiés (daliro, lorani, tamila, tiroma, tavaro, varelo)
# — 11/11/2026 au soir.
#
# LE PROBLÈME. Plafond Vercel gratuit : cent déploiements par vingt-quatre
# heures, atteint le 11/11 à 15 h 50 puis de nouveau à 18 h 15. Sept
# projets Vercel reliés au même dépôt se déployaient à chaque push sur
# main, et une construction « ignorée » (outils/vercel-ignore.sh) compte
# quand même pour un déploiement : quatorze pushs par jour, et tout
# s'arrête. Plusieurs sessions poussent en parallèle : c'est arrivé deux
# fois le même jour.
#
# LE REMÈDE. Vercel ne déploie plus rien tout seul sur un push
# (vercel.json : git.deploymentEnabled.main = false, pour les sept projets).
# Les déploiements sont créés par l'API : omegaai.fr (pegase-site2) à
# chaque push, et chaque site dédié seulement quand un commit du push le
# touche (règle de outils/vercel-ignore.sh, listée par outils/a-deployer.sh).
# Qui les crée : la session qui a poussé (outil Vercel create_deployment,
# règle de CLAUDE.md), et une tâche planifiée qui vérifie chaque heure que
# rien n'est en retard. Cette action est la troisième voie, la seule qui
# ne dépende d'aucune session : elle déploie par la CLI Vercel avec
# l'identifiant du projet (construction chez Vercel, variables du projet).
# Elle n'a besoin que d'un secret GitHub, VERCEL_TOKEN (jeton créé sur
# vercel.com › Account › Settings › Tokens, équipe teo18). Tant qu'il
# manque, elle ne fait rien et le dit, sans échouer : les deux autres
# voies suffisent.
# ══════════════════════════════════════════════════════════════════════
name: Déploiements Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sites-dedies
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - site: pegase-site2
            projet: prj_fbQJSkiLGbPrJOhFWD4bIPRENutY
          - site: daliro
            projet: prj_Pjssj7PKpbpY5uJ9NGb4oycaFHPh
          - site: lorani
            projet: prj_b4rLNOu9d6FnF40TlQcfoxUHPfBG
          - site: tamila
            projet: prj_09Ax3DqxQ1M2R3fTluQQqFHXELov
          - site: tiroma
            projet: prj_BkCpEHsTecjgHWev68ac2aAmDpnf
          - site: tavaro
            projet: prj_fxF1lwxRZf4htkLrypOsjHEc5W8W
          - site: varelo
            projet: prj_l6l18zJGFSH5aow2Zaxm8IImxeMg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ce push touche-t-il ${{ matrix.site }} ?
        id: touche
        env:
          AVANT: ${{ github.event.before }}
        run: |
          set +e
          if [ "${{ matrix.site }}" = "pegase-site2" ]; then code=1; else
            VERCEL_GIT_PREVIOUS_SHA="$AVANT" bash outils/vercel-ignore.sh "${{ matrix.site }}"; code=$?
          fi
          set -e
          if [ "$code" = "1" ]; then echo "deployer=oui" >> "$GITHUB_OUTPUT"; else echo "deployer=non" >> "$GITHUB_OUTPUT"; fi

      - name: Le secret VERCEL_TOKEN est-il posé ?
        id: jeton
        if: steps.touche.outputs.deployer == 'oui'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Pas de secret VERCEL_TOKEN : ${{ matrix.site }} sera déployé par la session qui a poussé ou par la tâche planifiée, pas par cette action."
            echo "present=non" >> "$GITHUB_OUTPUT"
          else
            echo "present=oui" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.touche.outputs.deployer == 'oui' && steps.jeton.outputs.present == 'oui'
        with:
          node-version: 22

      - name: Déployer ${{ matrix.site }} sur Vercel (construction chez Vercel)
        if: steps.touche.outputs.deployer == 'oui' && steps.jeton.outputs.present == 'oui'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_i1M2yUINJBwJA66d6L9i62OF
          VERCEL_PROJECT_ID: ${{ matrix.projet }}
        run: |
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            -m githubCommitSha="${{ github.sha }}" -m githubCommitRef=main \
            -m githubCommitMessage="$(git log -1 --format=%s | cut -c1-120)"
